{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<section class="auth-card"><h1>Sign in</h1><p>Access the transaction monitoring dashboard.</p>
<form method="post"><label>Username<input name="username" required autocomplete="username"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button type="submit">Login</button></form><p>New user? <a href="{{ url_for('auth.register') }}">Create an account</a></p></section>{% endblock %}
