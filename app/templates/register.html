{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<section class="auth-card"><h1>Create account</h1>
<form method="post"><label>Username<input name="username" minlength="3" required></label>
<label>Password (at least 8 characters)<input type="password" name="password" minlength="8" required></label>
<button type="submit">Register</button></form><p>Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></section>{% endblock %}
